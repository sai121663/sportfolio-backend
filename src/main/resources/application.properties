spring.application.name=demo
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
server.error.include-message=always
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sportfolio}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sportfolio}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:sportfolio}
rapidapi.key=${RAPIDAPI_KEY}
server.port=${PORT:8080}